<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nails Fuchs · Fort Myers</title>
<style>
:root{--bg:#fff7fa;--card:#fff;--ink:#2b1d24;--mute:#7a6670;--pink:#d6336c;--pink2:#fde2ec;--line:#f0d5df;--gold:#f5b942;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1217;--card:#271a21;--ink:#f6e9ee;--mute:#b79ba7;--pink:#ff6b9d;--pink2:#3a2230;--line:#3d2a34}}
:root[data-theme="dark"]{--bg:#1c1217;--card:#271a21;--ink:#f6e9ee;--mute:#b79ba7;--pink:#ff6b9d;--pink2:#3a2230;--line:#3d2a34}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
header{text-align:center;padding:18px 0 8px;position:relative}
h1{margin:0;font-size:30px;color:var(--pink);letter-spacing:.5px}
.sub{color:var(--mute);margin:2px 0 10px}
.lang{position:absolute;right:0;top:12px;display:flex;gap:4px}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:13px}
.lang button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.cta{display:flex;gap:8px;justify-content:center;margin:8px 0 4px;flex-wrap:wrap}
a.btn,button.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer}
.p{background:var(--pink);color:#fff}.s{background:var(--pink2);color:var(--pink)}
h2{font-size:18px;margin:22px 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
.promo{margin-top:14px;border-radius:18px;padding:18px 16px;text-align:center;color:#fff;background:linear-gradient(135deg,#d6336c,#ff7eb3 55%,#f5b942);box-shadow:0 8px 22px rgba(214,51,108,.28);position:relative;overflow:hidden}
.promo small{display:inline-block;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 12px;font-weight:700;letter-spacing:1px;font-size:12px}
.promo b{display:block;font-size:24px;line-height:1.15;margin:8px 0 4px}
.promo span{display:block;font-size:14px;opacity:.95}
.promo i{font-style:normal;position:absolute;opacity:.55;font-size:22px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.svc button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font-size:15px;font:inherit}
.svc button.on{border-color:var(--pink);background:var(--pink2);box-shadow:inset 0 0 0 1px var(--pink)}
.svc span{display:block;color:var(--pink);font-weight:700;font-size:14px}
.hours{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hours div{display:flex;justify-content:space-between;padding:3px 0}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
label{font-size:13px;color:var(--mute);display:grid;gap:4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chosen{font-size:14px;background:var(--pink2);color:var(--ink);border-radius:10px;padding:8px 10px}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
.acts{display:grid;gap:8px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:20px 0 28px}
footer a{color:var(--pink)}
.err{color:#d33;font-size:13px;min-height:16px}
header{background:linear-gradient(160deg,var(--pink2),var(--card));border:1px solid var(--line);border-radius:22px;padding:44px 14px 16px;margin-top:4px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:700;letter-spacing:1px}
.lang{top:12px;right:12px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
</style>
</head>

</div>

<div id="gal"></div>

  </div>
  <p class="note" id="policy"></p>
</form>

<footer><span id="foot"></span><br><a href="https://instagram.com/nails_fuchs" target="_blank" rel="noopener">@nails_fuchs</a></footer>
</main>

var L="es",SEL=[];
var $=function(i){return document.getElementById(i)};
function pr(p){return typeof p=="string"?p:p[L]}
function all(){var a=[];GROUPS.forEach(function(g){a=a.concat(g.items)});return a}
function names(){return all().filter(function(s){return SEL.indexOf(s.id)>-1}).map(function(s){return s[L]})}
function guess(){try{if(!/^es/i.test(navigator.language))return "en"}catch(e){}return "es"}
function setL(l){
  L=l;var t=I18[l];document.documentElement.lang=l;
  ["tag","goBook","pBadge","pTitle","pSub","hSvc","hHours","hBook","lName","lDate","lTime","lNote","wa","sms","policy","foot"].forEach(function(k){$(k).textContent=t[k]});
  $("call").textContent=t.call;$("call").href="tel:+1"+CFG.phone;
  $("bes").className=l=="es"?"on":"";$("ben").className=l=="en"?"on":"";
  $("svcBox").innerHTML=GROUPS.map(function(g,gi){return '<h3>'+g[l]+'</h3><div class="svc">'+g.items.map(function(s){return '<button type="button" data-id="'+s.id+'" class="'+(SEL.indexOf(s.id)>-1?"on":"")+'">'+s[l]+'<span>'+pr(s.p)+'</span></button>'}).join("")+'</div>'}).join("");
  Array.prototype.forEach.call($("svcBox").querySelectorAll("button"),function(b){b.onclick=function(){var id=b.getAttribute("data-id"),i=SEL.indexOf(id);if(i>-1)SEL.splice(i,1);else SEL.push(id);setL(L)}});
  $("hours").innerHTML='<div><span>'+t.hw+'</span><b>'+t.hwT+'</b></div><div><span>'+t.hwe+'</span><b>'+t.hweT+'</b></div>';
  var n=names();$("chosen").textContent=n.length?t.chosenT+n.join(", "):t.chosen0;
  $("gal").innerHTML=GALLERY.length?'<h2>'+(l=="es"?"✨ Nuestro trabajo":"✨ Our work")+'</h2><div class="gal">'+GALLERY.map(function(s){return '<img loading="lazy" alt="Nails Fuchs" src="'+s+'">'}).join("")+'</div>':"";
}
function inHours(d,h){
  var day=new Date(d+"T12:00:00").getDay(),we=(day==0||day==6);
  return we?(h>="09:00"&&h<="13:00"):(h>="17:00"&&h<="22:00");
}
function build(){
  var t=I18[L],n=$("name").value.trim(),d=$("date").value,h=$("time").value,sv=names();
  if(!n){$("err").textContent=t.eN;return null}
  if(!sv.length){$("err").textContent=t.eS;return null}
  if(!d||!h){$("err").textContent=t.eD;return null}
  if(!inHours(d,h)){$("err").textContent=t.eH+t.hw+": "+t.hwT+" · "+t.hwe+": "+t.hweT;return null}
  $("err").textContent="";
  var nt=$("notes").value.trim();
  return t.msg+"\n"+t.f[0]+": "+n+"\n"+t.f[1]+": "+sv.join(", ")+"\n"+t.f[2]+": "+d+"\n"+t.f[3]+": "+h+(nt?"\n"+t.f[4]+": "+nt:"");
}
$("wa").onclick=function(){var m=build();if(m)window.open("https://wa.me/1"+CFG.phone+"?text="+encodeURIComponent(m),"_blank")};
$("sms").onclick=function(){var m=build();if(m)location.href="sms:+1"+CFG.phone+"?body="+encodeURIComponent(m)};
var td=new Date();$("date").min=td.getFullYear()+"-"+("0"+(td.getMonth()+1)).slice(-2)+"-"+("0"+td.getDate()).slice(-2);
setL(guess());
</script>
